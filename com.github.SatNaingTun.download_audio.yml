app-id: com.github.SatNaingTun.download_audio
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: download-audio
finish-args:
  - --share=network
  - --filesystem=host
modules:
  - name: download-audio
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app .
    sources:
      - type: dir
        path: .